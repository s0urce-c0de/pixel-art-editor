<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./logo.svg">
    <title>Pixel Art Editor</title>
    <style>
        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
            font-family: sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
        }

        div#canvas-container {
            grid-row: 2;
            justify-self: center;
            align-self: center;

            --border-size: 1em;
            border: var(--border-size) white solid;
            width: min(50vh, 50vw);
            height: min(50vh, 50vw);

            canvas#pixel-canvas {
                width: 100%;
                height: 100%;
                image-rendering: pixelated;
            }
        }

        header {
            grid-row: 1;
            width: 100%;
            background-color: gray;
            nav > ul {
                display: flex;
                gap: 0.5em;
                list-style-type: none;
                margin: 0;
                padding: 0;

                img, li {
                    padding: 0.25em 0.75em;
                    border-radius: 0.5em;
                }

                li {
                    cursor: pointer;
                }

                li:hover {
                    background-color: #00000020;
                }

                li:active, li.active {
                    background-color: #00000030;
                }
            }
        }
    </style>
    <script src="main.js" type="module" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul id="nav-list">
                <!-- Did you know: em refers to the text height? crazy rigth? -->
                <img src="./logo.svg" style="height: 1em; aspect-ratio: 1 / 1;">
                <li>File</li>
            </ul>
        </nav>
    </header>
    <div id="canvas-container">
        <canvas id="pixel-canvas"></canvas>
    </div>
</body>
</html>
