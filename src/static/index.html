<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./logo.svg">
    <title>Pixel Art Editor</title>
    <style>
        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
            font-family: sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
        }

        div#canvas-container {
            grid-row: 2;
            justify-self: center;
            align-self: center;

            --border-size: 1em;
            border: var(--border-size) white solid;
            width: min(50vh, 50vw);
            height: min(50vh, 50vw);

            canvas#pixel-canvas {
                width: 100%;
                height: 100%;
                image-rendering: pixelated;
            }
        }

            /* div.submenu {
                position: absolute;
                position-anchor: --menu-anchor;
                top: calc(anchor(bottom) + var(--padding-vertical));
                left: anchor(left);
            } */
    </style>
    <script src="main.js" type="module" defer></script>
</head>
<body>
    <nav-elem>
        <!--
        <ul id="nav-list">
            <!- Did you know: em refers to the text height? crazy rigth? ->
            <img src="./logo.svg" style="height: 1em; aspect-ratio: 1 / 1;">
        </ul>-->
    </nav-elem>
    <div id="canvas-container">
        <canvas id="pixel-canvas"></canvas>
    </div>
</body>
</html>
